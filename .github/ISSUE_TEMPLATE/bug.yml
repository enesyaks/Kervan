name: Bug report
description: Something doesn't work the way you expect.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new session…
        2. …
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where?
      options:
        - Mac app
        - Server
        - Setup (first launch, hub-setup.sh)
        - Node (kervan-node)
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "macOS 15.5, server 0.1.0 (Ubuntu 24.04), agent: Claude Code"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "On the server: `journalctl -u kervan -n 100`. Remove tokens and API keys first."
      render: text
