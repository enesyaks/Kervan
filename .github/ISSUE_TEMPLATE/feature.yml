name: Feature request
description: Something you'd like Kervan to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What can't you do today, or what feels harder than it should?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: The solution you have in mind; a sketch or screenshot helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you manage today, and what else did you consider?
