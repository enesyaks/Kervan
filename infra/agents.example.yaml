# Copy to /etc/kervan/agents.yaml and set KERVAN_AGENTS_FILE=/etc/kervan/agents.yaml in /etc/kervan/env.
# Without the file the server offers the builtin adapters it can run: claude, codex, gemini.
# The first agent is the app's default. Agents whose command can't be run are skipped (see the log).
# Secrets (API keys) belong in /etc/kervan/env, which every agent inherits; per-agent `env` is for plain settings.
agents:
  claude:
    name: Claude Code
    command: builtin          # bundled @agentclientprotocol/claude-agent-acp
  codex:
    name: Codex
    command: builtin          # bundled @agentclientprotocol/codex-acp; needs CODEX_API_KEY or OPENAI_API_KEY
  gemini:
    name: Gemini
    command: builtin          # bundled @google/gemini-cli --acp with authMethod gemini-api-key; needs GEMINI_API_KEY
    # authMethod: gemini-api-key   # ACP auth method chosen at start; any agent may set one
  # Any ACP agent on the VM's PATH:
  # opencode:
  #   name: OpenCode
  #   command: opencode
  #   args: [acp]

  # A command-line agent without ACP, run in a terminal. Each message is typed as a line; the answer
  # is what it prints until it has been quiet for quietMs.
  # aider:
  #   name: Aider
  #   command: aider
  #   args: ["--no-pretty"]
  #   protocol: pty
  #   quietMs: 3000
